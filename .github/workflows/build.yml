name: Build & Publish Mod-Explorer Plugin

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false
        required: true
      version_tag:
        description: 'Version tag for the release (e.g., v1.0.0)'
        type: string
        default: 'v1.0.0'
        required: true

env:
  BUILD_CONFIG: Release
  BUILD_PLATFORM: x64
  PLUGIN_NAME: pme
  OUTPUT_DIR: .Bin\f4se\plugins
  F4SE_PLUGINS_DIR: ${{ github.workspace }}\.Bin\f4se\plugins

jobs:
  build:
    name: Build Mod-Explorer Plugin
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
          
      - name: Restore dependencies (submodules)
        run: |
          git submodule update --init --recursive
          
      - name: Build Release x64
        shell: pwsh
        run: |
          # Clean previous build artifacts
          if (Test-Path ".Bin") { Remove-Item -Recurse -Force .Bin }
          
          # Set environment variables for MSBuild
          $env:Configuration = "Release"
          $env:Platform = "x64"
          
          # Build the solution
          msbuild Mod-Explorer.sln `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:UseHostCompilerIfAvailable=true `
            /p:TreatWarningsAsErrors=false `
            /m:2 `
            /v:minimal
            
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }
          
          # Verify the plugin was built
          $pluginPath = Join-Path $env:F4SE_PLUGINS_DIR "$env:PLUGIN_NAME.dll"
          if (-not (Test-Path $pluginPath)) {
            Write-Error "Plugin DLL not found at: $pluginPath"
            exit 1
          }
          
          # Show build output info
          Write-Host "Build successful!" -ForegroundColor Green
          Write-Host "Plugin location: $pluginPath" -ForegroundColor Cyan
          Write-Host "File size: $(Get-Item $pluginPath).Length bytes" -ForegroundColor Yellow

      - name: Prepare release assets
        shell: pwsh
        run: |
          # Create a README for the release
          $releaseReadme = @"
          # Mod-Explorer Plugin Release

          ## Version: ${{ github.event.inputs.version_tag }}

          ### Build Information
          - **Build SHA**: ${{ github.sha }}
          - **Platform**: x64
          - **Configuration**: Release
          - **Built on**: Windows (GitHub Actions)

          ### What is Mod-Explorer?
          Mod-Explorer is a plugin for Fallout 4 that provides an in-game interface to explore and get items from mods.
          It features:
          - Comprehensive mod browsing and filtering
          - Detailed mod information display
          - Safe mod management operations
          - Allows you to obtain items from mods
          - Clean, intuitive UI

          ### Installation Instructions

          1. **Download the release** from the GitHub Releases page (see below)
          2. **Unpack the archive** into the Data game folder:
          ```
          <FALLOUT4_GAMEDIR>/Data/
          ```
          3. **Launch Fallout 4 with F4SE**:
             - Make sure you have [Fallout 4 Script Extender (F4SE)](https://f4se.sircomposers.studio/) installed
             - Add `-f4se` to your game launch options in Steam or your preferred launcher

          ### Release Contents
          - `pme.dll` - The main plugin DLL
          - `Interface\**\*.txt` - Localization files

          ### Requirements
          - Windows 10/11 (64-bit)
          - Fallout 4 with F4SE installed
          - Dear Modding UI

          ### License
          This project is licensed under the terms specified in `LICENSE`.

          ---
          *Generated by GitHub Actions on ${{ github.event.repository.updated_at }}*
          "@
          # Save the release README
          New-Item -Path "release-readme.md" -Force | Out-Null
          $releaseReadme | Set-Content -Path "release-readme.md" -Encoding UTF8

      - name: Prepare artifact structure
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP "ModExplorer-Artifact"
          $f4sePluginsPath = Join-Path $artifactRoot "f4se/plugins"

          New-Item -ItemType Directory -Force -Path $f4sePluginsPath | Out-Null

          $sourceDll = Join-Path $env:F4SE_PLUGINS_DIR "$env:PLUGIN_NAME.dll"
          if (-not (Test-Path $sourceDll)) {
            Write-Error "Plugin DLL not found at: $sourceDll"
            exit 1
          }
          Copy-Item -Path $sourceDll -Destination $f4sePluginsPath -Force
          Write-Host "Copied pme.dll to: $f4sePluginsPath" -ForegroundColor Cyan

          $dataSource = "Data"
          if (Test-Path $dataSource) {
            Get-ChildItem -Path $dataSource -Force | ForEach-Object {
              $dest = Join-Path $artifactRoot $_.Name
              if ($_.PSIsContainer) {
                Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
              } else {
                Copy-Item -Path $_.FullName -Destination $artifactRoot -Force
              }
            }
            Write-Host "Copied Data contents to artifact root (structure preserved)" -ForegroundColor Cyan
          } else {
            Write-Warning "Data folder not found; skipping data copy"
          }

          if (Test-Path "release-readme.md") {
            Copy-Item -Path "release-readme.md" -Destination $artifactRoot -Force
            Write-Host "Copied release-readme.md to artifact" -ForegroundColor Cyan
          }

          Write-Host "Artifact structure prepared at: $artifactRoot" -ForegroundColor Green

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModExplorer-Plugin-${{ github.sha }}
          path: ${{ runner.temp }}/ModExplorer-Artifact
          retention-days: 7

      - name: Archive ModExplorer Artifacts
        if: github.event.inputs.publish_release == 'true'
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ runner.temp }}/ModExplorer-Artifact/*" -Exclude "release-readme.md" | 
          Compress-Archive -DestinationPath "${{ runner.temp }}/Mod-Explorer-Plugin.zip" -Force

      - name: Create GitHub Release (if requested)
        uses: softprops/action-gh-release@v3
        if: github.event.inputs.publish_release == 'true'
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: Mod-Explorer Plugin ${{ github.event.inputs.version_tag }}
          body_path: ${{ runner.temp }}/ModExplorer-Artifact/release-readme.md
          generate_release_notes: true
          files: ${{ runner.temp }}/Mod-Explorer-Plugin.zip
          draft: false
          prerelease: false
