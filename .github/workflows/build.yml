name: Build & Publish Mod-Explorer Plugin

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false
        required: true
      version_tag:
        description: 'Version tag for the release (e.g., v1.0.0)'
        type: string
        default: 'v1.0.0'
        required: true

env:
  BUILD_CONFIG: Release
  BUILD_PLATFORM: x64
  PLUGIN_NAME: pme
  OUTPUT_DIR: .Bin\f4se\plugins
  F4SE_PLUGINS_DIR: ${{ github.workspace }}\.Bin\f4se\plugins

jobs:
  build:
    name: Build Mod-Explorer Plugin
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
          
      - name: Restore dependencies (submodules)
        run: |
          git submodule update --init --recursive
          
      - name: Build Release x64
        shell: pwsh
        run: |
          # Clean previous build artifacts
          if (Test-Path ".Bin") { Remove-Item -Recurse -Force .Bin }
          
          # Set environment variables for MSBuild
          $env:Configuration = "Release"
          $env:Platform = "x64"
          
          # Build the solution
          msbuild Mod-Explorer.sln `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:UseHostCompilerIfAvailable=true `
            /p:TreatWarningsAsErrors=false `
            /m:2 `
            /v:minimal
            
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }
          
          # Verify the plugin was built
          $pluginPath = Join-Path $env:F4SE_PLUGINS_DIR "$env:PLUGIN_NAME.dll"
          if (-not (Test-Path $pluginPath)) {
            Write-Error "Plugin DLL not found at: $pluginPath"
            exit 1
          }
          
          # Show build output info
          Write-Host "Build successful!" -ForegroundColor Green

      # Upload the full workspace source temporarily so the publish job can access the 'Data' folder
      - name: Upload Workspace Source
        uses: actions/upload-artifact@v4
        with:
          name: workspace-source
          path: ${{ github.workspace }}
          retention-days: 1

  publish:
    name: Publish Release Artifacts
    needs: build
    if: ${{ github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Workspace Source
        uses: actions/download-artifact@v4
        with:
          name: workspace-source
          path: staging

      # Package according to custom directory rules
      - name: Package Mod Archive
        shell: pwsh
        run: |
          # 1. Create a clean distribution directory
          New-Item -ItemType Directory -Force -Path "dist\f4se\plugins" | Out-Null
          
          # 2. Place pme.dll into dist/f4se/plugins
          Copy-Item -Path "staging\.Bin\f4se\plugins\${{ env.PLUGIN_NAME }}.dll" -Destination "dist\f4se\plugins\" -Force
          
          # 3. Copy contents of the Data folder to the root of dist (preserving structure)
          if (Test-Path "staging\Data") {
              Copy-Item -Path "staging\Data\*" -Destination "dist\" -Recurse -Force
          } else {
              Write-Warning "Source Data folder was not found in the repository root!"
          }
          
          # 4. Zip the contents of the dist folder directly into the archive root
          Get-ChildItem -Path "dist\*" | Compress-Archive -DestinationPath "${{ env.PLUGIN_NAME }}-${{ github.event.inputs.version_tag }}.zip" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.version_tag }}" `
            "${{ env.PLUGIN_NAME }}-${{ github.event.inputs.version_tag }}.zip" `
            --title "Release ${{ github.event.inputs.version_tag }}" `
            --notes "Automated build release for version ${{ github.event.inputs.version_tag }}." `
            --target ${{ github.sha }}
