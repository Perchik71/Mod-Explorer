name: Build & Publish Mod-Explorer Plugin

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false
        required: true
      version_tag:
        description: 'Version tag for the release (e.g., v1.0.0)'
        type: string
        default: 'v1.0.0'
        required: true

env:
  BUILD_CONFIG: Release
  BUILD_PLATFORM: x64
  PLUGIN_NAME: pme
  OUTPUT_DIR: .Bin\f4se\plugins
  F4SE_PLUGINS_DIR: ${{ github.workspace }}\.Bin\f4se\plugins

jobs:
  build:
    name: Build Mod-Explorer Plugin
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-version: '17.8'
          
      - name: Restore dependencies (submodules)
        run: |
          git submodule update --init --recursive
          
      - name: Build Release x64
        shell: pwsh
        run: |
          # Clean previous build artifacts
          if (Test-Path ".Bin") { Remove-Item -Recurse -Force .Bin }
          
          # Set environment variables for MSBuild
          $env:Configuration = "Release"
          $env:Platform = "x64"
          
          # Build the solution
          msbuild Mod-Explorer.sln `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:UseHostCompilerIfAvailable=true `
            /p:TreatWarningsAsErrors=false `
            /m:2 `
            /v:minimal
            
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit $LASTEXITCODE
          }
          
          # Verify the plugin was built
          $pluginPath = Join-Path $env:F4SE_PLUGINS_DIR "$env:PLUGIN_NAME.dll"
          if (-not (Test-Path $pluginPath)) {
            Write-Error "Plugin DLL not found at: $pluginPath"
            exit 1
          }
          
          # Show build output info
          Write-Host "Build successful!" -ForegroundColor Green
          Write-Host "Plugin location: $pluginPath" -ForegroundColor Cyan
          Write-Host "File size: $(Get-Item $pluginPath).Length bytes" -ForegroundColor Yellow
          
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModExplorer-Plugin-${{ github.sha }}
          path: |
            .Bin\f4se\plugins\pme.dll
            .Lib\**\*.lib
            .LinkConf\**\*
            # Copy Data folder contents to root of archive
            - ".Data\*.*" | ForEach-Object { cp $_ "${{ runner.temp }}\ModExplorer-${{ github.sha }}\$($_)" }
          
      - name: Prepare release assets
        shell: pwsh
        run: |
          # Create a README for the release
          $releaseReadme = @"
          # Mod-Explorer Plugin Release

          ## Version: ${{ github.event.inputs.version_tag }}

          ### Build Information
          - **Build SHA**: ${{ github.sha }}
          - **Platform**: x64
          - **Configuration**: Release
          - **Built on**: Windows (GitHub Actions)

          ### What is Mod-Explorer?
          Mod-Explorer is a plugin for Fallout 4 that provides an in-game interface to explore and manage mods. It features:
          - Comprehensive mod browsing and filtering
          - Detailed mod information display
          - Safe mod management operations
          - Clean, intuitive UI

          ### Installation Instructions

          1. **Download the release** from the GitHub Releases page (see below)
          2. **Copy the plugin DLL** (`pme.dll`) to your F4SE plugins directory:
          ```
          %APPDATA%\F4SE\plugins\
          ```
          3. **Launch Fallout 4 with F4SE**:
             - Make sure you have [Fallout 4 Script Extender (F4SE)](https://f4se.sircomposers.studio/) installed
             - Add `-f4se` to your game launch options in Steam or your preferred launcher

          ### Release Contents
          - `pme.dll` - The main plugin DLL
          - `.Lib\**\*.lib` - Static library files (for reference)
          - `.LinkConf\**\*` - Link configuration files (for reference)

          ### Requirements
          - Fallout 4 with F4SE installed
          - Windows 10/11 (64-bit)
          - DirectX 11 runtime components

          ### License
          This project is licensed under the terms specified in `LICENSE.txt`.

          ---
          *Generated by GitHub Actions on ${{ github.event.repository.updated_at }}*
          "@
          # Save the release README
          New-Item -Path "release-readme.md" -Force | Out-Null
          $releaseReadme | Set-Content -Path "release-readme.md" -Encoding UTF8

      - name: Create GitHub Release (if requested)
        uses: softprops/action-gh-release@v1
        if: github.event.inputs.publish_release == 'true'
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: Mod-Explorer Plugin v${{ github.event.inputs.version_tag }}
          body: |
            # Mod-Explorer Plugin Release
            
            **Version**: ${{ github.event.inputs.version_tag }}
            
            ### Build Information
            - **Build SHA**: ${{ github.sha }}
            - **Platform**: x64
            - **Configuration**: Release
            - **Built on**: Windows (GitHub Actions)
            
            ### What is Mod-Explorer?
            Mod-Explorer is a plugin for Fallout 4 that provides an in-game interface to explore and manage mods. It features:
            - Comprehensive mod browsing and filtering
            - Detailed mod information display
            - Safe mod management operations
            - Clean, intuitive UI
            
            ### Installation Instructions
            
            1. **Download the release** from this page
            2. **Copy the plugin DLL** (`pme.dll`) to your F4SE plugins directory:
               ```
               %APPDATA%\F4SE\plugins\
               ```
            3. **Launch Fallout 4 with F4SE**:
               - Make sure you have [Fallout 4 Script Extender (F4SE)](https://f4se.sircomposers.studio/) installed
               - Add `-f4se` to your game launch options in Steam or your preferred launcher
            
            ### Release Contents
            - `pme.dll` - The main plugin DLL
            - `.Lib\**\*.lib` - Static library files (for reference)
            - `.LinkConf\**\*` - Link configuration files (for reference)
            
            ### Requirements
            - Fallout 4 with F4SE installed
            - Windows 10/11 (64-bit)
            - DirectX 11 runtime components
            
            ### License
            This project is licensed under the terms specified in `LICENSE.txt`.
          files: |
            .Bin\f4se\plugins\pme.dll
            release-readme.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify on completion
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Output workflow summary
        run: |
          echo "Build completed successfully!"
          echo "Plugin uploaded to artifact: ModExplorer-Plugin-${{ github.sha }}"
          if (github.event.inputs.publish_release == 'true'); then
            echo "Release published with tag: ${{ github.event.inputs.version_tag }}"
          else
            echo "Release NOT published - use workflow_dispatch again with publish_release=true"
          fi
